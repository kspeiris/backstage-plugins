apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: promote-openchoreo-component
  title: Promote OpenChoreo Component
  description: >
    Prepare a GitOps promotion request for an existing OpenChoreo
    Component and open a GitHub Pull Request for human review.
  tags:
    - openchoreo
    - gitops
    - promotion

spec:
  owner: openchoreo-users
  type: service
  # Enable user token injection for OpenChoreo validation and OCC-backed actions.
  EXPERIMENTAL_formDecorators:
    - id: openchoreo:inject-user-token

  parameters:
    - title: Component Details
      required:
        - namespace
        - project
        - component
        - targetEnvironment
        - releaseName
      properties:
        namespace:
          title: Namespace
          type: string
          description: OpenChoreo namespace containing the existing component
          ui:autofocus: true

        project:
          title: Project
          type: string
          description: OpenChoreo project containing the existing component

        component:
          title: Component
          type: string
          description: Name of the existing component to promote

        targetEnvironment:
          title: Target Environment
          type: string
          description: Environment to which the component should be promoted
          pattern: '^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$'

        releaseName:
          title: Component Release
          type: string
          description: >
            Existing release name to promote. Verify that this release
            belongs to the selected component.

        generationMode:
          title: Generation Mode
          type: string
          description: >
            How the ReleaseBinding manifest is produced. "auto" uses the OCC
            CLI and falls back to the canonical manifest when the GitOps
            repository does not contain the OpenChoreo resources. "occ"
            requires the OCC CLI to succeed.
          default: auto
          enum:
            - auto
            - occ

    - title: GitOps Repository
      required:
        - repoUrl
        - gitopsRepoUrl
        - targetBranch
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          description: >
            Select the GitOps repository to which the promotion PR will be opened.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

        gitopsRepoUrl:
          title: GitOps Repository URL
          type: string
          description: >
            Full HTTPS URL of the GitOps repository (e.g. https://github.com/OWNER/REPO).
            This must match the repository selected above.
          pattern: '^https://github\.com/[^/]+/[^/]+/?$'

        targetBranch:
          title: Target Branch
          type: string
          default: main
          description: Existing branch against which the PR should be opened

  steps:
    - id: validate
      name: Validate Promotion Inputs
      action: openchoreo:gitops:validate
      input:
        namespace: ${{ parameters.namespace }}
        project: ${{ parameters.project }}
        component: ${{ parameters.component }}
        targetEnvironment: ${{ parameters.targetEnvironment }}

    - id: resolvePath
      name: Resolve GitOps Manifest Path
      action: openchoreo:gitops:resolve-path
      input:
        namespace: ${{ steps.validate.output.namespace }}
        project: ${{ steps.validate.output.project }}
        component: ${{ steps.validate.output.component }}
        targetEnvironment: ${{ steps.validate.output.targetEnvironment }}

    - id: fetchRepo
      name: Fetch Target GitOps Branch
      action: fetch:plain
      input:
        url: ${{ parameters.gitopsRepoUrl }}/tree/${{ parameters.targetBranch }}

    - id: prepare
      name: Generate ReleaseBinding
      action: openchoreo:gitops:releasebinding:generate
      input:
        namespace: ${{ steps.validate.output.namespace }}
        project: ${{ steps.validate.output.project }}
        component: ${{ steps.validate.output.component }}
        targetEnvironment: ${{ steps.validate.output.targetEnvironment }}
        releaseName: ${{ parameters.releaseName }}
        generationMode: ${{ parameters.generationMode }}

    - id: checkConflicts
      name: Check for Existing Promotion Pull Requests
      action: openchoreo:gitops:check-conflicts
      input:
        repository: ${{ parameters.gitopsRepoUrl }}
        targetBranch: ${{ parameters.targetBranch }}
        targetPath: ${{ steps.resolvePath.output.targetPath }}
        namespace: ${{ steps.validate.output.namespace }}
        project: ${{ steps.validate.output.project }}
        component: ${{ steps.validate.output.component }}
        targetEnvironment: ${{ steps.validate.output.targetEnvironment }}

    - id: publish
      name: Open GitHub Pull Request
      if: ${{ not steps.checkConflicts.output.hasConflict }}
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: promote/${{ steps.validate.output.component }}-to-${{ steps.validate.output.targetEnvironment }}
        title: Promote ${{ steps.validate.output.component }} to ${{ steps.validate.output.targetEnvironment }}
        description: |
          ## Summary

          Promote the `${{ steps.validate.output.component }}` component to `${{ steps.validate.output.targetEnvironment }}`.

          ## Change details

          - Component: `${{ steps.validate.output.component }}`
          - Project: `${{ steps.validate.output.project }}`
          - Target environment: `${{ steps.validate.output.targetEnvironment }}`
          - Change type: ReleaseBinding update

          ## Generated resources

          - `${{ steps.resolvePath.output.targetPath }}`

          ## Generated by

          OpenChoreo Project 702 GitOps promotion workflow.

          ### Reviewer checklist
          - [ ] Verify the existing component and target environment.
          - [ ] Review the generated ReleaseBinding manifest.
          - [ ] Confirm the change is safe before merging.

          This PR requires human review and must not be auto-merged.
        sourcePath: promotion-staging
        targetPath: projects/${{ steps.validate.output.project }}/components/${{ steps.validate.output.component }}/release-bindings
        targetBranchName: ${{ parameters.targetBranch }}

    - id: trackPromotion
      name: Track Pull Request Status
      if: ${{ steps.publish.output.remoteUrl }}
      action: openchoreo:gitops:track-promotion
      input:
        namespace: ${{ steps.validate.output.namespace }}
        project: ${{ steps.validate.output.project }}
        component: ${{ steps.validate.output.component }}
        targetEnvironment: ${{ steps.validate.output.targetEnvironment }}
        repositoryUrl: ${{ parameters.gitopsRepoUrl }}
        pullRequestUrl: ${{ steps.publish.output.remoteUrl }}

  output:
    links:
      - title: View GitHub Pull Request
        url: ${{ steps.publish.output.remoteUrl }}
    text:
      - title: Pull Request Created
        icon: success
        content: >-
          Your promotion request was submitted for review. The change has not
          been applied to the target environment yet. Component:
          `${{ steps.validate.output.component }}`. Target:
          `${{ steps.validate.output.targetEnvironment }}`. Pull request:
          [View the GitHub pull request](${{ steps.publish.output.remoteUrl }}).
